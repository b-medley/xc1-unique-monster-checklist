<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback — Kingdom Hearts Final Mix checklist | ProgressDial</title>
<meta name="description" content="Report wrong or missing data, a bug, or a suggestion for the Kingdom Hearts Final Mix checklist.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Same palette and type as index.html, so the two pages read as one site. */
  :root{
    --night:#0d1220; --night-soft:#121a2e; --panel:#161f38; --raised:#20294a;
    --line:#2b3558; --line-soft:#232c4c; --ink:#eef1fa; --dim:#9aa5c8; --faint:#68729a;
    --gold:#ffd166; --gold-soft:rgba(255,209,102,0.14); --gold-line:rgba(255,209,102,0.35);
    --danger:#ff7b6e; --ok:#5fcf9a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 850px 480px at 50% -12%, rgba(90,120,220,0.13), transparent 62%),
      var(--night);
    color:var(--ink); font-family:'Atkinson Hyperlegible',sans-serif; font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  button,input,select,textarea{font-family:inherit;}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  header.site{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:640px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);}
  .brand-mark{width:28px;height:28px;flex:0 0 auto;border-radius:50%;border:2.5px solid var(--gold);position:relative;}
  .brand-mark::after{content:"";position:absolute;left:50%;top:34%;width:6px;height:6px;background:var(--gold);border-radius:50%;transform:translate(-50%,-50%);}
  .brand-mark::before{content:"";position:absolute;left:50%;top:54%;width:3.5px;height:9px;background:var(--gold);transform:translateX(-50%);clip-path:polygon(15% 0,85% 0,100% 100%,0 100%);}
  .brand-name{font-family:'Sora',sans-serif;font-weight:700;font-size:15px;letter-spacing:-.01em;}
  .brand-name small{display:block;font-family:'Atkinson Hyperlegible',sans-serif;font-weight:400;font-size:11px;color:var(--faint);}
  .back-link{color:var(--dim);text-decoration:none;font-size:13px;padding:8px 12px;border-radius:99px;white-space:nowrap;}
  .back-link:hover{color:var(--ink);background:var(--panel);}

  main{max-width:640px;margin:0 auto;padding:14px 20px 50px;}
  h1{font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(21px,4.6vw,26px);letter-spacing:-.02em;margin:0 0 6px;}
  .sub{color:var(--dim);font-size:14px;margin:0 0 22px;}

  form{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:16px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  label{font-size:13px;font-weight:700;color:var(--dim);}
  label .opt{font-weight:400;color:var(--faint);}
  select,textarea,input[type="email"]{
    width:100%;background:var(--night-soft);border:1px solid var(--line);border-radius:12px;
    color:var(--ink);padding:12px 14px;font-size:15px;
  }
  textarea{min-height:150px;resize:vertical;line-height:1.5;}
  ::placeholder{color:var(--faint);}
  .hint{font-size:12.5px;color:var(--faint);}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;} /* spam trap, hidden from people */

  .send-btn{align-self:flex-start;background:var(--gold);color:var(--night);border:1px solid var(--gold);border-radius:99px;padding:12px 26px;font-size:14px;font-weight:700;cursor:pointer;}
  .send-btn:disabled{opacity:.6;cursor:default;}

  .status{border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;display:none;}
  .status.show{display:block;}
  .status.ok{background:rgba(95,207,154,.12);border:1px solid var(--ok);color:#c9f2de;}
  .status.err{background:rgba(255,123,110,.10);border:1px solid var(--danger);color:#ffc4bd;}

  footer.site{max-width:640px;margin:0 auto;padding:0 20px 44px;font-size:12.5px;color:var(--faint);}
  footer.site a{color:var(--dim);text-decoration:underline;text-underline-offset:2px;}
  footer.site a:hover{color:var(--gold);}
</style>
</head>
<body>

<header class="site">
  <a class="brand" href="./">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">ProgressDial<small>Kingdom Hearts</small></span>
  </a>
  <a class="back-link" href="./">&larr; Back to the checklist</a>
</header>

<main>
  <h1>Feedback</h1>
  <p class="sub">Spotted something wrong or missing in the checklist, or have an idea? Tell me here.</p>

  <form id="feedback-form" action="https://formspree.io/f/xkjwbdoo" method="POST" novalidate>
    <!-- Tags every message so Kingdom Hearts feedback can be told apart from the other checklists. -->
    <input type="hidden" name="checklist" value="Kingdom Hearts I Final Mix">
    <input type="hidden" name="_subject" value="Feedback: Kingdom Hearts I Final Mix checklist">
    <div class="hp" aria-hidden="true"><label>Leave this empty <input type="text" name="_gotcha" tabindex="-1" autocomplete="off"></label></div>

    <div class="field">
      <label for="fb-topic">What is it about?</label>
      <select id="fb-topic" name="topic">
        <option value="Wrong or missing data">Wrong or missing data</option>
        <option value="Bug on the page">Bug on the page</option>
        <option value="Suggestion">Suggestion</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="field">
      <label for="fb-message">Message</label>
      <textarea id="fb-message" name="message" placeholder="For a data fix, the world and the item or mark help a lot."></textarea>
    </div>

    <div class="field">
      <label for="fb-email">Email <span class="opt">(optional)</span></label>
      <input type="email" id="fb-email" name="email" autocomplete="email" placeholder="Only if you'd like a reply">
    </div>

    <div class="status" id="fb-status" role="status" aria-live="polite"></div>
    <button type="submit" class="send-btn" id="fb-send">Send feedback</button>
  </form>
</main>

<footer class="site">
  <a href="./">Back to the checklist</a>
</footer>

<script>
(function(){
  "use strict";
  var form = document.getElementById("feedback-form"),
      message = document.getElementById("fb-message"),
      status = document.getElementById("fb-status"),
      send = document.getElementById("fb-send");

  function show(kind, text){
    status.className = "status show " + kind;
    status.textContent = text;
  }

  /* Sent in the background so the reader stays on this page and gets a
     plain message in place -- no pop-up dialogs, no redirect. */
  form.addEventListener("submit", function(e){
    e.preventDefault();
    if (!message.value.trim()){
      show("err", "Please write a message first.");
      message.focus();
      return;
    }
    send.disabled = true;
    send.textContent = "Sending…";
    fetch(form.action, {method:"POST", body:new FormData(form), headers:{"Accept":"application/json"}})
      .then(function(res){
        if (!res.ok) throw new Error("status "+res.status);
        form.reset();
        show("ok", "Thanks, your feedback was sent.");
      })
      .catch(function(){
        show("err", "Couldn’t send that. Check your connection and try again.");
      })
      .then(function(){
        send.disabled = false;
        send.textContent = "Send feedback";
      });
  });
})();
</script>
<script data-goatcounter="https://nishekan.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
